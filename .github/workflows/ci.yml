name: ci

on:
  push:
    branches:
      - main
    paths:
      - ".github/CODEOWNERS"
      - ".github/workflows/ci.yml"
      - "config/requirements/**"
      - "codex/skills/repo-privacy-guardian/**"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "MANIFEST.in"
      - "build_helpers.py"
      - "Repo_Privacy_Guardian.py"
      - "repo_privacy_guardian/**"
      - "repo_privacy_guardian*.py"
      - "repo_privacy_guardian_assets/**"
      - "repo_privacy_guardian_resources/**"
      - "scripts/benchmark_large_history.py"
      - "scripts/check_artifact_install.py"
      - "scripts/check_release_contract.py"
      - "scripts/dev/install_codex_skill.ps1"
      - "scripts/release_readiness.py"
      - "scripts/visual_qa_gui.py"
      - "tests/**"
      - "docs/prompts/04_EJECUCION_AGENTICA_CLI.prompt.md"
      - "docs/prompts/05_DOGFOODING_AUDIT_ONLY.prompt.md"
      - "docs/prompts/06_PREPARACION_ENTORNO_AGENTICA.prompt.md"
      - "docs/prompts/07_AUDITORIA_REPARACION_AGENTICA.prompt.md"
      - "docs/prompts/en/04_AGENTIC_CLI_EXECUTION.prompt.md"
      - "docs/prompts/en/05_DOGFOODING_AUDIT_ONLY.prompt.md"
      - "docs/prompts/en/06_AGENTIC_ENVIRONMENT_SETUP.prompt.md"
      - "docs/prompts/en/07_AGENTIC_AUDIT_AND_REPAIR.prompt.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/CODEOWNERS"
      - ".github/workflows/ci.yml"
      - "config/requirements/**"
      - "codex/skills/repo-privacy-guardian/**"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "MANIFEST.in"
      - "build_helpers.py"
      - "Repo_Privacy_Guardian.py"
      - "repo_privacy_guardian/**"
      - "repo_privacy_guardian*.py"
      - "repo_privacy_guardian_assets/**"
      - "repo_privacy_guardian_resources/**"
      - "scripts/benchmark_large_history.py"
      - "scripts/check_artifact_install.py"
      - "scripts/check_release_contract.py"
      - "scripts/dev/install_codex_skill.ps1"
      - "scripts/release_readiness.py"
      - "scripts/visual_qa_gui.py"
      - "tests/**"
      - "docs/prompts/04_EJECUCION_AGENTICA_CLI.prompt.md"
      - "docs/prompts/05_DOGFOODING_AUDIT_ONLY.prompt.md"
      - "docs/prompts/06_PREPARACION_ENTORNO_AGENTICA.prompt.md"
      - "docs/prompts/07_AUDITORIA_REPARACION_AGENTICA.prompt.md"
      - "docs/prompts/en/04_AGENTIC_CLI_EXECUTION.prompt.md"
      - "docs/prompts/en/05_DOGFOODING_AUDIT_ONLY.prompt.md"
      - "docs/prompts/en/06_AGENTIC_ENVIRONMENT_SETUP.prompt.md"
      - "docs/prompts/en/07_AGENTIC_AUDIT_AND_REPAIR.prompt.md"
  workflow_dispatch:
    inputs:
      extended_checks:
        description: Run the manual extended validation suite
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cost-first policy: automatic CI is path-gated to executable and validation-tooling surfaces.
  # Docs-only changes stay local-first; use workflow_dispatch when a protected PR needs a check.
  # Canonical packaged prompt texts are runtime inputs, so their exact paths trigger checks.
  smoke:
    name: CLI smoke + release contract (automatic, ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install base package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Smoke CLI help
        run: repo-privacy-guardian --help

      - name: Smoke module help
        run: python -m Repo_Privacy_Guardian --help

      - name: Smoke direct script help
        run: python Repo_Privacy_Guardian.py --help

      - name: Check release contract drift
        run: python scripts/check_release_contract.py

      - name: Smoke CLI clean repo
        run: python tests/release_smoke_cli.py

  lint:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_checks }}
    name: Ruff + Pyright (manual, ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install GUI + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]"

      - name: Run ruff
        run: python -m ruff check .

      - name: Run pyright
        run: pyright -p pyrightconfig.json

  test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_checks }}
    name: CLI / pytest (manual, ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install GUI + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]"

      - name: Run pytest
        run: python -m pytest

  package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_checks }}
    name: Package smoke (manual, ubuntu-latest, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Validate wheel and sdist outside the checkout
        run: python scripts/check_artifact_install.py dist/*.whl dist/*.tar.gz

  gui-smoke-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_checks }}
    name: GUI smoke (manual, windows-2025-vs2026, py3.11)
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install GUI + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,test]"

      - name: Smoke GUI initialization
        run: python tests/release_smoke_gui.py
